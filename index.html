<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Interview Assistant</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- ── Header / Drag Bar ─────────────────────────────────────── -->
  <header class="header" id="drag-region">
    <div class="header-left">
      <img src="assets/icon.png" class="header-logo" alt="Logo" />
      <span class="app-title">Interview Assistant</span>
      <span class="hotkey-badge">Panic (Alt+C)</span>
    </div>




    <div class="header-controls">
      <button class="ctrl-btn" id="btn-minimize" title="Minimize">
        <svg viewBox="0 0 24 24"><path d="M19 13H5v-2h14v2z"/></svg>
      </button>

      <button class="ctrl-btn" id="btn-maximize" title="Maximize / Restore">
        <svg viewBox="0 0 24 24"><path d="M4 4h16v16H4V4zm2 4v10h12V8H6z"/></svg>
      </button>

      <button class="ctrl-btn close-btn" id="btn-close" title="Close (Alt+F4)">
        <svg viewBox="0 0 24 24"><path d="M19 6.4L17.6 5 12 10.6 6.4 5 5 6.4 10.6 12 5 17.6 6.4 19 12 13.4 17.6 19 19 17.6 13.4 12z"/></svg>
      </button>
    </div>
  </header>

  </header>

  <!-- ── Gemini Web Panel (BrowserView renders here) ─────────────── -->
  <div class="gemini-slot" id="gemini-slot">
    <div class="gemini-loading" id="gemini-loading">
      <div class="spinner"></div>
      <p>Loading Gemini…</p>
    </div>
  </div>

  <!-- ── Footer / Controls ──────────────────────────────────────── -->
  <footer class="footer">

    <!-- Search box row -->
    <div class="search-row">
      <input
        type="text"
        id="search-input"
        class="search-input"
        placeholder="Type or speak → Enter sends to Gemini"
        autocomplete="off"
        spellcheck="false"
      />
      <button id="mic-btn" class="mic-search-btn" title="Click to speak (Ctrl+Shift+M)">
        <svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm-1-9c0-.55.45-1 1-1s1 .45 1 1v6c0 .55-.45 1-1 1s-1-.45-1-1V5zm6 6c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>
      </button>
      <button id="search-send" class="search-send-btn" title="Send to Gemini">
        <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
      </button>
    </div>

    <!-- Bottom bar: opacity + 3 tools right beside slider + status -->
    <div class="footer-controls">
      <div class="opacity-wrap" title="Window Opacity">
        <svg viewBox="0 0 24 24" class="icon-sm"><path d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9c.83 0 1.5-.67 1.5-1.5 0-.39-.15-.74-.39-1.01-.23-.26-.38-.61-.38-.99 0-.83.67-1.5 1.5-1.5H16c2.76 0 5-2.24 5-5 0-4.42-4.03-8-9-8z"/></svg>
        <input type="range" id="opacity-slider" min="30" max="100" value="92" />

        <div class="footer-tools">
          <button class="footer-tool-btn" id="btn-stealth" title="Stealth Mode (Alt+Z)">
            <svg viewBox="0 0 24 24"><path d="M17.73 12.02l3.98-3.98a.996.996 0 1 0-1.41-1.41L16.31 10.6A8.99 8.99 0 0 0 12 9.5c-1.93 0-3.72.61-5.19 1.64L3.22 7.55a.996.996 0 1 0-1.41 1.41l3.29 3.29C4.07 13.37 3.5 14.62 3.5 16c0 4.69 7.5 7.5 8.5 7.5 1 0 8.5-2.81 8.5-7.5 0-1.38-.57-2.63-1.52-3.73zM12 21.5c-.67 0-6.5-2.25-6.5-5.5s5.83-5.5 6.5-5.5 6.5 2.25 6.5 5.5-5.83 5.5-6.5 5.5zM12 13c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
          </button>
          <button class="footer-tool-btn" id="btn-click-through" title="Click-Through (Alt+X)">
            <svg viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.7 7.6 1 12c1.7 4.4 6 7.5 11 7.5s9.3-3.1 11-7.5C21.3 7.6 17 4.5 12 4.5zm0 12.5c-2.8 0-5-2.2-5-5s2.2-5 5-5 5 2.2 5 5-2.2 5-5 5zm0-8c-1.7 0-3 1.3-3 3s1.3 3 3 3 3-1.3 3-3-1.3-3-3-3z"/></svg>
          </button>
          <button class="footer-tool-btn" id="btn-reload" title="Reload Gemini (Alt+R)">
            <svg viewBox="0 0 24 24"><path d="M17.65 6.35A7.958 7.958 0 0 0 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
          </button>
          <button class="footer-tool-btn" id="btn-clear-data" title="Clear All Data & Sessions">
            <svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
          </button>
        </div>
      </div>



      <div class="status-dot-wrap">
        <div class="status-dot" id="status-dot"></div>
        <span class="status-label" id="status-label">Ready</span>
      </div>
    </div>


  </footer>

  <!-- ── Custom Dark Confirmation Modal ────────────────────────────── -->
  <div class="modal-overlay" id="confirm-modal">
    <div class="modal-card">
      <div class="modal-icon">⚠️</div>
      <p class="modal-title">Clear All Data & Sessions?</p>
      <p class="modal-text">This will erase all session cache & local storage. Are you sure?</p>
      <div class="modal-actions">
        <button class="modal-btn cancel-btn" id="modal-cancel">Cancel</button>
        <button class="modal-btn confirm-btn" id="modal-confirm">Clear Data</button>
      </div>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
